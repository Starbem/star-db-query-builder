name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write # required for npm Trusted Publishing (OIDC) — https://docs.npmjs.com/trusted-publishers/

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 8.6.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test:ci

      # No NPM_TOKEN / NODE_AUTH_TOKEN: npm auto-detects the id-token permission
      # above and exchanges it for a short-lived publish credential via OIDC —
      # nothing to store as a secret. Requires Trusted Publisher configured on
      # npmjs.com for this package pointing at this repo + workflow file.
      - run: npm install -g npm@11.5.1
      - run: npm publish --access public

      - name: Build release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | sed -n '2p')

          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "${PREV_TAG}..${GITHUB_REF_NAME}" --no-merges --pretty=format:"- \`%h\` %s")
            COMPARE_URL="../../compare/${PREV_TAG}...${GITHUB_REF_NAME}"
          else
            COMMITS=$(git log "${GITHUB_REF_NAME}" --no-merges --pretty=format:"- \`%h\` %s")
            COMPARE_URL=""
          fi

          {
            printf "## \`@starbemtech/star-db-query-builder@%s\`\n\n" "$VERSION"
            printf -- "---\n\n"
            printf "### 🔖 Commits\n\n"
            if [ -n "$PREV_TAG" ]; then
              printf "_Changes since %s:_\n\n" "$PREV_TAG"
            fi
            printf "%s\n\n" "$COMMITS"
            if [ -n "$COMPARE_URL" ]; then
              printf "[Full diff](%s)\n\n" "$COMPARE_URL"
            fi
            printf -- "---\n\n"
            printf "### 📦 Install\n\`\`\`bash\npnpm add @starbemtech/star-db-query-builder@%s\n\`\`\`\n" "$VERSION"
          } > release-body.md

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-body.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
