# SonarQube (https://sonar.starbem.dev) - usado pelo workflow sonarqube.yml.
sonar.projectKey=star-db-query-builder
sonar.projectName=star-db-query-builder
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src
sonar.exclusions=src/**/*.spec.ts,src/**/*.test.ts,src/**/__tests__/**,src/setupTests.ts
sonar.test.inclusions=src/**/*.spec.ts,src/**/*.test.ts,src/**/__tests__/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
